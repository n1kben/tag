<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Rooftop Fu</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#4fa9f2" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Rooftop Fu" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lilita+One&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* iOS home-screen apps draw under the status bar but report a viewport that's short by its height,
       so full-screen layers use --app-h (the real screen height there) instead of inset: 0 */
    :root { --app-h: 100%; }
    html.standalone { --app-h: 100lvh; }
    html, body { width: 100%; height: var(--app-h); overflow: hidden; background: #e3e9f6; overscroll-behavior: none; }
    #app { position: fixed; top: 0; left: 0; width: 100%; height: var(--app-h); }
    body { touch-action: manipulation; } /* no double-tap zoom */
    canvas { display: block; }
  </style>
  <script>if (navigator.standalone) document.documentElement.classList.add('standalone');</script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/client/main.ts"></script>
</body>
</html>
